[package]
name = "omnesagent-s1"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local System One typed decision layer (Laya / ModernBERT) for OmnesAgent."
publish = false

[dependencies]
omnesagent-log.workspace = true
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hex = "0.4"
parking_lot = "0.12"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.50", default-features = false, features = ["rt", "macros", "time", "sync", "fs", "io-util"] }
tracing = "0.1"

# Candle local neural inference
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
hf-hub = { version = "0.4", optional = true }

[features]
default = ["candle"]
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]

[dev-dependencies]
tempfile = "3.26"
tokio = { version = "1.50", features = ["full"] }
