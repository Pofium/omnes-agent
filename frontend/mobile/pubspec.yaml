name: omnes_mobile
description: OmnesAgent Mobile Client for Android & iOS.

publish_to: 'none'

version: 4.2.0+43

environment:
  sdk: ">=3.4.3 <4.2.0"

dependencies:
  flutter:
    sdk: flutter
  omnes_shared:
    path: ../shared

  google_sign_in: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  get: ^4.6.6
  flutter_svg: ^2.0.11
  http: ^1.2.2
  get_storage: ^2.1.1
  flutter_spinkit: ^5.2.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  saver_gallery: ^4.0.0
  permission_handler: 11.3.1
  device_info_plus: 
  share_plus: ^10.1.1
  flutter_inappwebview: ^6.1.5
  http_auth: ^1.0.4
  flutter_local_notifications: ^17.2.4
  image_picker: ^1.1.2
  animated_text_kit: ^4.2.2
  font_awesome_flutter: ^10.7.0
  uuid: ^4.5.1
  syncfusion_flutter_pdf: ^27.1.57 
  syncfusion_flutter_pdfviewer: ^27.1.57
  path_provider: ^2.1.5
  datetime_picker_formfield_new: ^2.1.0
  intl: ^0.19.0
  timezone: ^0.9.4
  flutter_launcher_icons: ^0.14.1
  webview_flutter:
  supabase_flutter: ^2.15.4
  web_socket_channel: ^3.0.3
  universal_io: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

dependency_overrides:
  http: 1.2.2

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/Logo/
    - assets/icon/
    - assets/icon/cover_letter.svg
    - assets/icon/diet_chart.svg