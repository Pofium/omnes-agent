name: omnes_shared
description: Shared core, gateway client, localization, models, and design tokens for OmnesAgent.
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ">=3.4.3 <4.2.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  get_storage: ^2.1.1
  http: ^1.2.2
  web_socket_channel: ^3.0.3
  font_awesome_flutter: 10.7.0
  universal_io: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  http: 1.2.2

flutter:
  uses-material-design: true
